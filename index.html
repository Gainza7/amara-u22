<script>
const SID="1OktRl-PofOIF0I65JTSGj5BfSKHqC6UrW1MMm3pzTZ4";
const GS="Google Sheets";
const LOAD_TABS=["ALEXIS","PAU","BRU","ROGER","KASPAR"];
const RPE_NAMES=["Roger","Bru","Kaspar","Alexis","Baba","Pau"];
/* Practice 3 = entreno con el equipo ACB: solo lo hacen estos jugadores. Minutos en BD TIEMPO E; en las pestañas de jugador O = RPE P3, P = minutos P3. */
const ACB_PLAYERS=["Pau","Alexis"];
const TCOL={1:"B",2:"C",3:"E"};
function playersFor(p){return p===3?S.players.filter(n=>ACB_PLAYERS.includes(n)):S.players}
function minOf(t,p){return t?(p===1?t.p1:p===2?t.p2:t.p3):null}
const BORG=["","Muy muy suave","Muy suave","Suave","Moderado","Algo duro","Duro","Muy duro","Muy muy duro","Casi máximo","Máximo"];
const RPE_COL=["","#3d8fb8","#3a9aa0","#3fa27f","#5fa851","#93a83c","#c79a26","#d97d24","#d65a25","#c63a2a","#9e1f2a"];

const S={tab:"sesion",date:isoToday(),practice:1,mcp:null,db:null,assets:null,
  rpe:{rows:[],next:2,loaded:false},tiempo:{byDM:{},loaded:false},pesos:null,panel:null,
  loads:{},loadTab:"ALEXIS",photos:{},players:RPE_NAMES.slice(),err:null,pesoDate:isoToday(),
  horario:{rows:[],next:2,loaded:false},week:mondayOf(isoToday()),draft:null,reading:false,readMsg:"",sample:null,imgOK:false,practiceSet:false,kiosk:false,well:{rows:[],loaded:false,week:null,all:false},ent:{rows:[],next:2,loaded:false,date:isoToday(),ses:1,mode:"plan",draft:null,removed:[],reading:false,msg:"",text:"",fname:"",saving:false}};
function mondayOf(iso){const d=new Date(iso+"T12:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return toIso(d)}
function toIso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return toIso(d)}
function plannedFor(iso){return S.horario.rows.filter(r=>r.iso===iso).sort((a,b)=>a.prac-b.prac||String(a.hora).localeCompare(String(b.hora)))}

function isoToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseDMY(s){if(!s)return null;const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(!m)return null;
  let y=m[3]?+m[3]:null;if(y&&y<100)y+=2000;return {d:+m[1],m:+m[2],y}}
function dmyToIso(s){const p=parseDMY(s);if(!p||!p.y)return null;return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0")}
function isoToDMY(iso){const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y}
function isoToDM(iso){const [,m,d]=iso.split("-");return d+"/"+m}
function num(v){if(v===undefined||v===null||v==="")return null;const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n}
function fmt(n,dec=1){return n==null?"–":n.toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-")}
function colLetter(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function niceDate(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
let toastT;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
function setSync(t){document.getElementById("syncTxt").textContent=t}

function errText(e){
  const c=e&&e.code;
  if(c==="server_not_connected")return "Falta la dirección del Apps Script de la hoja en config.js.";
  if(c==="needs_reauth")return "La clave de la app no es correcta. Escríbela otra vez.";
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required")return "La app necesita tu permiso para usar Google Sheets. Pulsa Actualizar y acepta el aviso.";
  if(c==="selection_required")return "Tienes más de una conexión de Google Sheets. Elige una en el aviso de claude.ai.";
  if(c==="blocked_by_policy")return "Tu organización bloquea Google Sheets para esta app.";
  if(c==="server_unavailable")return "Google Sheets no responde ahora mismo. Prueba de nuevo en un momento.";
  if(c==="tool_error")return "Google Sheets rechazó la operación: "+(e.message||"").slice(0,160);
  return "No se pudo hablar con Google Sheets ("+(c||"error")+").";
}

async function sget(range){
  const r=await S.mcp.callTool(GS,"get_values",{spreadsheetId:SID,range},{cache:false});
  const p=r.payload;return (p&&p.values)||[];
}
async function sset(range,values){await S.mcp.callTool(GS,"update_values",{spreadsheetId:SID,range,values})}

/* RPE es un IMPORTRANGE de la hoja antigua: nunca se escribe ahí (pisarlo da #REF!). Lo nuevo va a RPE NUEVOS, que 'RPE App' lee primero. */
const RPE_NEW="'RPE NUEVOS'";
async function loadRPE(){
  const [old,nu]=await Promise.all([sget("RPE!A1:E3000"),sget(RPE_NEW+"!A1:E3000")]);
  const map=src=>(r,i)=>({src,row:i+1,name:(r[1]||"").trim(),val:num(r[2]),iso:dmyToIso(r[3]),prac:(r[4]||"").trim()});
  S.rpe.rows=old.map(map("old")).slice(1).concat(nu.map(map("new")).slice(1));
  S.rpe.next=Math.max(2,nu.length+1);S.rpe.loaded=true;
  const extra=[...new Set(S.rpe.rows.map(r=>r.name).filter(Boolean))].filter(n=>!S.players.includes(n));
  S.players=S.players.concat(extra);
}
async function loadTiempo(){
  const rows=await sget("'BD TIEMPO'!A1:E500");const by={};
  rows.forEach((r,i)=>{const p=parseDMY(r[0]);if(p){by[String(p.d).padStart(2,"0")+"/"+String(p.m).padStart(2,"0")]={row:i+1,p1:num(r[1]),p2:num(r[2]),p3:num(r[4])}}});
  S.tiempo.byDM=by;S.tiempo.loaded=true;
}
async function loadPesos(){
  S.pesos=await sget("PESOS!A1:Z40");
  S.panel=await sget("'PANEL PESOS'!A5:I40");
}
async function loadLoad(tab){S.loads[tab]=await sget(tab+"!A1:P500")}
async function loadHorario(){
  const rows=await sget("HORARIO!A1:F500");
  S.horario.rows=rows.map((r,i)=>({row:i+1,iso:dmyToIso(r[0]),prac:num(r[1])||1,hora:(r[2]||"").trim(),tipo:(r[3]||"").trim(),min:num(r[4]),notas:(r[5]||"").trim()})).slice(1).filter(r=>r.iso);
  S.horario.next=Math.max(2,rows.length+1);S.horario.loaded=true;
}
function pickPractice(){
  if(S.practiceSet)return;const ses=plannedFor(S.date);if(!ses.length)return;
  const open=ses.find(s=>S.players.some(n=>{const f=findRPE(n,S.date,s.prac);return !f||f.pending}));
  S.practice=(open||ses[0]).prac===2?2:1;
}

async function loadAll(){
  setSync("Leyendo la hoja…");S.err=null;render();
  try{
    await Promise.all([loadRPE(),loadTiempo(),loadHorario().catch(()=>{S.horario.loaded=true})]);
    pickPractice();render();
    await Promise.all([loadPesos(),loadLoad(S.loadTab),(S.tab==="entrenos"||S.ent.loaded)?loadEntrenos():null,(S.tab==="wellness"||S.well.loaded)?loadWellness():null]);
    const t=new Date();setSync("Hoja al día · "+t.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){S.err=errText(e);setSync("Sin conexión con la hoja")}
  render();
}

function findRPE(name,iso,p){
  const lab="Practice "+p;
  const exact=S.rpe.rows.filter(r=>r.name===name&&r.iso===iso&&r.prac===lab);
  if(exact.length)return {rec:exact[exact.length-1],pending:false};
  const loose=S.rpe.rows.filter(r=>r.name===name&&r.iso===iso&&!r.prac);
  if(loose.length)return {rec:loose[loose.length-1],pending:true};
  return null;
}

async function saveRPE(name,val){
  const iso=S.date,p=S.practice,f=findRPE(name,iso,p);
  const card=document.querySelector('[data-player="'+CSS.escape(name)+'"]');card&&card.classList.add("saving");
  try{
    if(f&&f.rec.src==="new"){
      await sset(RPE_NEW+"!C"+f.rec.row+":E"+f.rec.row,[[val,isoToDMY(iso),"Practice "+p]]);
      f.rec.val=val;f.rec.prac="Practice "+p;
    }else{
      const n=S.rpe.next;const now=new Date();
      const ts=isoToDMY(isoToday())+" "+now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      await sset(RPE_NEW+"!A"+n+":E"+n,[[ts,name,val,isoToDMY(iso),"Practice "+p]]);
      S.rpe.rows.push({src:"new",row:n,name,val,iso,prac:"Practice "+p});S.rpe.next=n+1;
    }
    toast(S.kiosk?"Guardado. Gracias, "+name:name+": RPE "+val+" guardado");
    S.loads={};
  }catch(e){toast(errText(e))}
  render();
}

async function saveTiempo(min){
  const dm=isoToDM(S.date),t=S.tiempo.byDM[dm];
  if(!t){toast("Esa fecha no está en BD TIEMPO. Añade la fila en la hoja.");return}
  const col=TCOL[S.practice];
  try{await sset("'BD TIEMPO'!"+col+t.row,[[min===null?"":min]]);t["p"+S.practice]=min;toast("Tiempo de sesión guardado");S.loads={}}
  catch(e){toast(errText(e))}
  render();
}

/* ---------- render ---------- */
const main=document.getElementById("main");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false"));
  const banner=S.err?`<div class="banner bad"><div>${esc(S.err)}</div></div>`:"";
  document.body.classList.toggle("kiosk",S.kiosk);
  document.getElementById("title").textContent=S.kiosk?"RPE U22":"Amara Lleida U22";
  if(S.kiosk)main.innerHTML=banner+viewKiosk()+`<div class="row" style="justify-content:center;margin-top:18px"><button type="button" class="btn ghost holdbtn" id="kioskOff"><span class="holdfill"></span><span class="holdtxt">← Volver</span></button></div>`;
  else if(S.tab==="horario")main.innerHTML=banner+viewHorario();
  else if(S.tab==="sesion")main.innerHTML=banner+viewSesion();

/* Las pestañas de jugador no tienen todas las columnas en el mismo sitio (en PAU, Practice 3 va en E y en ALEXIS en O),
   así que cada columna se busca por su cabecera de la fila 1. Si no aparece, se usa la posición de siempre. */
function loadCols(h){const H=h.map(x=>String(x||"").toUpperCase().replace(/\s+/g," ").trim());
  const f=(re,def)=>{const i=H.findIndex(x=>re.test(x));return i>=0?i:(H.length>def?def:-1)};
  return {r1:f(/^PRACTICE 1$/,2),r2:f(/^PRACTICE 2$/,3),r3:f(/^PRACTICE 3$/,14),t1:f(/^TIEMP\w* P1$/,4),t2:f(/^TIEMP\w* P2$/,5),t3:f(/^TIEMP\w* P3$/,15),
    load:f(/^T\.? ?LOAD$/,7),acute:f(/^ACUTE/,8),chronic:f(/^CHRONIC/,9),acwr:f(/^ACWR/,10)}}
function viewCarga(){
  const chips=`<div class="chips">${LOAD_TABS.map(t=>`<button type="button" data-load="${t}" aria-pressed="${S.loadTab===t}">${t.charAt(0)+t.slice(1).toLowerCase()}</button>`).join("")}</div>`;
  const rows=S.loads[S.loadTab];
  if(!rows)return chips+`<div class="empty">Leyendo la pestaña ${S.loadTab}…</div>`;
  const today=S.date;
  const c=loadCols(rows[0]||[]);const v=(r,k)=>c[k]<0?null:num(r[c[k]]);
  const data=rows.slice(1).map(r=>({iso:dmyToIso(r[1]),r1:v(r,"r1")||0,r2:v(r,"r2")||0,t1:v(r,"t1")||0,t2:v(r,"t2")||0,r3:v(r,"r3")||0,t3:v(r,"t3")||0,load:v(r,"load")||0,acute:v(r,"acute"),chronic:v(r,"chronic"),acwr:v(r,"acwr")}))
    .filter(d=>d.iso&&d.iso<=today);
  const last=data.slice(-28);
  if(!last.length)return chips+`<div class="empty">No hay días registrados hasta ${esc(isoToDMY(today))}.</div>`;
  S.chartLast=last;
  const cur=last[last.length-1];
  const missing=last.filter(d=>(d.r1>0&&d.t1===0)||(d.r2>0&&d.t2===0)||(d.r3>0&&d.t3===0));
  const zone=cur.acwr==null?null:cur.acwr<0.8?["warn","Baja"]:cur.acwr<=1.3?["ok","Óptima"]:cur.acwr<=1.5?["warn","Alta"]:["bad","Peligro"];
  const wk=data.slice(-7).reduce((a,d)=>a+d.load,0);
  const warn=missing.length?`<div class="banner warn"><div><b>${missing.length} días con RPE pero sin minutos</b> en las últimas 4 semanas (${missing.slice(-6).map(d=>isoToDM(d.iso)).join(", ")}${missing.length>6?"…":""}). Esos días cuentan como carga 0, así que el ACWR sale más bajo de lo real. Apunta el tiempo en Sesión.</div></div>`:"";
  return chips+warn+`<div class="kpis">
    <div class="kpi"><span class="label">ACWR hoy</span><b>${fmt(cur.acwr,2)}</b>${zone?`<span class="pill ${zone[0]}">${zone[1]}</span>`:""}</div>
    <div class="kpi"><span class="label">Carga 7 días</span><b>${Math.round(wk).toLocaleString("es-ES")}</b><span class="note">UA (RPE × min)</span></div>
    <div class="kpi"><span class="label">Aguda / crónica</span><b style="font-size:24px">${fmt(cur.acute,0)} / ${fmt(cur.chronic,0)}</b><span class="note">EWMA 7 / 28 días</span></div>
  </div>
  <div class="panel"><span class="label">Carga diaria · últimos 28 días</span><div class="chartbox" data-chart="load">${barChart(last)}</div></div>
  <div class="panel"><span class="label">ACWR · franja 0,8–1,3</span><div class="chartbox" data-chart="acwr">${acwrChart(last)}</div></div>`;
}

function barChart(d){
  const W=640,H=200,L=40,B=26,T=10;const max=Math.max(100,...d.map(x=>x.load));const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const bw=(W-L-8)/d.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=d.map((x,i)=>{const h=(H-T-B)-(y(x.load)-T);const miss=(x.r1>0&&x.t1===0)||(x.r2>0&&x.t2===0)||(x.r3>0&&x.t3===0);
    return `<rect data-i="${i}" x="${L+i*bw+2}" y="${y(x.load)}" width="${Math.max(2,bw-4)}" height="${Math.max(0,h)}" rx="3" fill="${miss?"var(--warn)":"var(--accent)"}"></rect>`+
      (miss&&x.load===0?`<circle cx="${L+i*bw+bw/2}" cy="${y(0)-5}" r="3" fill="var(--warn)"/>`:"")}).join("");
  const lab=d.map((x,i)=>i%7===0||i===d.length-1?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${isoToDM(x.iso)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Carga diaria">${g}${bars}${lab}</svg>`;
}
function acwrChart(d){
  const W=640,H=180,L=40,B=26,T=10;const vals=d.map(x=>x.acwr).filter(v=>v!=null);const top=Math.max(2,Math.ceil(Math.max(...vals,0)*2)/2);
  const bw=(W-L-8)/d.length;const y=v=>T+(H-T-B)*(1-v/top);const x=i=>L+i*bw+bw/2;
  let g=`<rect x="${L}" y="${y(1.3)}" width="${W-L-4}" height="${y(0.8)-y(1.3)}" fill="var(--ok-soft)"/>`;
  for(let v=0;v<=top+1e-9;v+=0.5)g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v,1)}</text>`;
  const pts=d.map((p,i)=>p.acwr==null?null:[x(i),y(Math.min(p.acwr,top))]).filter(Boolean);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const lp=pts[pts.length-1];
  const lab=d.map((p,i)=>i%7===0||i===d.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${isoToDM(p.iso)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="ACWR">${g}<path d="${path}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${lp?`<circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:""}${lab}</svg>`;
}
/* Tocar o pasar el ratón por un gráfico: muestra día y valor de la barra/punto más cercano (mismas medidas que barChart/acwrChart). */
function bindCharts(){
  document.querySelectorAll(".chartbox[data-chart]").forEach(box=>{
    const svg=box.querySelector("svg");const d=S.chartLast;if(!svg||!d||!d.length)return;
    const kind=box.dataset.chart,W=640,L=40,bw=(W-L-8)/d.length;let tip=null;
    const show=e=>{
      const r=svg.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*W;
      const i=Math.max(0,Math.min(d.length-1,Math.floor((vx-L)/bw)));const x=d[i];
      if(!tip){tip=document.createElement("div");tip.className="ctip";box.appendChild(tip)}
      const day=new Date(x.iso+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"numeric"});
      const ses=[[1,x.r1,x.t1],[2,x.r2,x.t2],[3,x.r3,x.t3]].filter(q=>q[1]||q[2]).map(q=>`P${q[0]}${q[0]===3?" ACB":""}: RPE ${q[1]?fmt(q[1],0):"–"} · ${q[2]?fmt(q[2],0)+" min":"sin minutos"}`);
      tip.innerHTML=kind==="load"?`<b>${esc(day)}</b>${ses.length?ses.map(esc).join("<br>"):"Sin sesión"}`:`<b>ACWR ${fmt(x.acwr,2)}</b>${esc(day)}`;
      const px=(L+i*bw+bw/2)/W*r.width+(r.left-box.getBoundingClientRect().left)+box.scrollLeft;
      tip.style.left=Math.max(50,Math.min(box.scrollWidth-50,px))+"px";
      svg.querySelectorAll("rect[data-i]").forEach(b=>b.classList.toggle("dim",+b.dataset.i!==i));
    };
    svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);
    svg.addEventListener("pointerleave",e=>{if(e.pointerType!=="mouse")return;if(tip){tip.remove();tip=null}svg.querySelectorAll("rect.dim").forEach(b=>b.classList.remove("dim"))});
  });
}
function niceStep(m){const r=m/4;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

function spark(vals){
  const v=vals.map((n,i)=>[i,n]).filter(p=>p[1]!=null);if(v.length<2)return "";
  const base=v[0][1],W=92,H=30,n=vals.length-1||1;const y=k=>H/2-(k-base)/5*(H/2-3);
  return `<svg viewBox="0 0 ${W} ${H}" width="92" height="30" aria-hidden="true"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3 3"/><path d="${v.map((p,i)=>(i?"L":"M")+(p[0]/n*(W-6)+3).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
}

async function savePesos(){
  const hdr=S.pesos[0]||[];const dm=isoToDM(S.pesoDate);
  let col=hdr.findIndex((h,i)=>i>=2&&String(h).trim()===dm);
  if(col<2){col=2;while(hdr[col]&&String(hdr[col]).trim()!=="")col++}
  if(col>25){toast("No queda sitio en PESOS (máximo columna Z).");return}
  const inputs=[...document.querySelectorAll("input[data-row]")];const maxRow=Math.max(...inputs.map(i=>+i.dataset.row));
  const vals=[["'"+dm]];for(let r=2;r<=maxRow;r++){const inp=inputs.find(i=>+i.dataset.row===r);const v=inp?num(inp.value):null;
    if(inp&&inp.value.trim()!==""&&v==null){toast("Peso no válido para "+inp.previousElementSibling.textContent);return}
    vals.push([v==null?"":v])}
  const L=colLetter(col);const btn=document.getElementById("savePeso");btn.disabled=true;
  try{await sset("PESOS!"+L+"1:"+L+maxRow,vals);toast("Pesaje del "+dm+" guardado");await loadPesos()}catch(e){toast(errText(e))}
  render();
}

function sesStatus(s){
  const done=S.players.filter(n=>{const f=findRPE(n,s.iso,s.prac);return f&&!f.pending}).length;
  const t=S.tiempo.byDM[isoToDM(s.iso)];const m=minOf(t,s.prac);
  const past=s.iso<=isoToday();
  const rpe=done?`<span class="pill ${done>=S.players.length?"ok":"warn"}">RPE ${done}/${S.players.length}</span>`:(past?`<span class="pill warn">Sin RPE</span>`:"");
  const min=m!=null&&m>0?`<span class="note">${m} min confirmados</span>`:(past?`<span class="pill ${s.min?"warn":"bad"}">${s.min?"Minutos sin confirmar":"Sin minutos"}</span>`:(s.min?`<span class="note">${s.min} min previstos</span>`:""));
  return rpe+min;

let pendingImg=null;
async function shrink(file){
  const img=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
}
async function readHorario(){
  const text=(document.getElementById("htext")||{}).value||"";S.htext=text;
  if(!pendingImg&&!text.trim()){S.readMsg="Elige una foto o pega el texto del horario primero.";render();return}
  const today=isoToday(),mon=mondayOf(today),dow=(new Date(today+"T12:00:00").getDay()+6)%7;
  const target=dow>=4?addDays(mon,7):mon;
  const prompt=`Eres el asistente de un preparador físico de un equipo de baloncesto U22 en España. Lee el horario semanal de entrenamientos${pendingImg?" de la imagen":""}${text.trim()?" y este texto:\n\n"+text.slice(0,6000)+"\n\n":". "}
Hoy es ${today}. Si el horario no indica año, usa el año que deje las fechas más cerca de hoy. Si solo indica días de la semana sin fecha, usa la semana que empieza el lunes ${target}.
Devuelve SOLO un array JSON. Un objeto por sesión de entrenamiento o partido, sin días de descanso:
{"fecha":"YYYY-MM-DD","sesion":1 o 2,"hora":"HH:MM" o "","tipo":"texto corto tal como aparece (Pista, Gimnasio, Partido, Recuperación…)","minutos":duración en minutos si se puede deducir de inicio y fin o se indica, si no null,"notas":"detalles útiles, o vacío"}
Vocabulario del club: "TARDE" es el entreno de equipo; "TEC" es tecnificación (tiro o táctica sin oposición, unos 90 min); "PF" es preparación física en gimnasio; "GERB", "Barris Nord" y "Cappont" son pabellones (van en notas, no en tipo).
Regla de "sesion": 1 para TARDE, entreno de equipo o partido; 2 para TEC. Las PF no son una sesión aparte: añade "PF gimnasio HH:MM-HH:MM aparte" en las notas de la sesión 2 de ese día (o de la 1 si no hay sesión 2). Si un día pone que no hay entrenamiento U22, ignora esa línea, pero incluye cualquier otra sesión del mismo día y marca "Por confirmar" en notas si lo pone.
Ejemplo: [{"fecha":"2026-10-21","sesion":1,"hora":"18:00","tipo":"Pista","minutos":105,"notas":""}]`;
  S.reading=true;S.readMsg="Leyendo el horario, puede tardar hasta un minuto…";render();
  try{
    const opts={modelTier:"default"};if(pendingImg)opts.images=[pendingImg];
    const out=await S.sample.json(prompt,opts);
    const arr=Array.isArray(out)?out:[];
    const clean=arr.map(o=>({fecha:/^\d{4}-\d{2}-\d{2}$/.test(o&&o.fecha)?o.fecha:"",sesion:(o&&+o.sesion===2)?2:1,hora:String(o&&o.hora||"").slice(0,5),tipo:String(o&&o.tipo||"").slice(0,40),minutos:Number.isFinite(+(o&&o.minutos))&&o.minutos!==null?Math.round(+o.minutos):null,notas:String(o&&o.notas||"").slice(0,120)}));
    if(!clean.length){S.readMsg="No he encontrado sesiones en el horario. Prueba con una foto más nítida o añádelas a mano."}
    else{S.draft=(S.draft||[]).concat(clean);S.readMsg="";S.htext="";S.hname="";pendingImg=null;if(clean[0].fecha)S.week=mondayOf(clean[0].fecha)}
  }catch(e){
    const c=e&&e.code;
    S.readMsg=c==="not_granted"?"Has denegado el permiso para leer el horario. Puedes añadir las sesiones a mano."
      :c==="invalid_json"?"No he podido entender el horario. Prueba con una foto más nítida o pega el texto."
      :c==="image_rejected"||c==="images_unavailable"?"No se ha podido usar esa imagen. Prueba con una captura en JPG o PNG, o pega el texto."
      :c==="rate_limited"?"Demasiadas lecturas seguidas. Espera un minuto y vuelve a probar."
      :"No se ha podido leer el horario ("+(c||"error")+"). Puedes añadir las sesiones a mano.";
  }
  S.reading=false;render();

const ENT="'ENTRENOS DATOS'";

function parseMin(v){const s=String(v??"").trim();if(!s)return null;const m=s.match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;return num(s)}
function fmtMin(n){if(n==null)return "";const m=Math.floor(n),s=Math.round((n-m)*60);return s===60?String(m+1):s?m+":"+String(s).padStart(2,"0"):String(m)}
/* Pistas como las escribe Iñigo: 1/2 = HC, 1/2+1 = HC+FC, 1/2+2 = HC+2FC, 1 = FC; "1/2 + open basket" se deja tal cual. */
function normPistas(v){const s=String(v||"").trim();const k=s.replace(/\s+/g,"").toLowerCase();
  if(k==="1/2")return "HC";if(k==="1/2+1")return "HC+FC";if(k==="1/2+2")return "HC+2FC";if(k==="1")return "FC";return s.toUpperCase()}

    const opts={modelTier:"default"};if(entImg)opts.images=[entImg];
    const out=await S.sample.json(prompt,opts);const arr=Array.isArray(out)?out:[];
    const clean=arr.filter(o=>o&&o.ejercicio).map(o=>({ejercicio:String(o.ejercicio).toUpperCase().slice(0,60),pistas:normPistas(o.pistas).slice(0,40),
      minutos:Number.isFinite(+o.minutos)&&o.minutos!==null?fmtMin(+o.minutos):""}));
    if(!clean.length)E.msg="No he encontrado ejercicios. Prueba con una foto más nítida o añádelos a mano.";
    else{E.draft=(E.draft||[]).concat(clean);E.msg="";E.text="";E.fname="";entImg=null}
  }catch(e){const c=e&&e.code;
    E.msg=c==="not_granted"?"Has denegado el permiso para leer el entreno. Puedes añadir los ejercicios a mano."
      :c==="invalid_json"?"No he podido entender el entreno. Prueba con una foto más nítida o pega el texto."
      :c==="image_rejected"||c==="images_unavailable"?"No se ha podido usar esa imagen. Prueba con una captura en JPG o PNG, o pega el texto."
      :c==="rate_limited"?"Demasiadas lecturas seguidas. Espera un minuto y vuelve a probar."
      :"No se ha podido leer el entreno ("+(c||"error")+"). Puedes añadir los ejercicios a mano.";}
  E.reading=false;render();
}
async function saveEntreno(){
  syncEnt();const E=S.ent;const d=E.draft;d.forEach(stopTimer);
  for(const x of d){if(!x.ejercicio.trim()){toast("Falta el nombre en algún ejercicio");return}
    if(String(x.minutos).trim()!==""&&parseMin(x.minutos)==null){toast("Minutos no válidos en "+x.ejercicio);return}}
  E.saving=true;render();
  try{
    /* Las filas que ya ocupaba la sesión se reparten en el orden de la lista; lo que sobre va al final de la hoja. */
    const slots=d.filter(x=>x.row).map(x=>x.row).sort((a,b)=>a-b);
    const line=x=>{const m=parseMin(x.minutos);return {ad:[isoToDMY(E.date),E.ses,x.ejercicio.trim().toUpperCase(),m==null?"":Math.round(m*100)/100],hi:[normPistas(x.pistas),x.notas||""]}};
    const fresh=[];
    for(let k=0;k<d.length;k++){const l=line(d[k]);
      if(k<slots.length){const r=slots[k];await sset(ENT+"!A"+r+":D"+r,[l.ad]);if(d[k].notas===undefined)await sset(ENT+"!H"+r,[[l.hi[0]]]);else await sset(ENT+"!H"+r+":I"+r,[l.hi])}else fresh.push(l)}
    for(const r of (E.removed||[])){await sset(ENT+"!A"+r+":D"+r,[["","","",""]]);await sset(ENT+"!H"+r+":I"+r,[["",""]])}
    if(fresh.length){const a=E.next,b=a+fresh.length-1;
      await sset(ENT+"!A"+a+":D"+b,fresh.map(f=>f.ad));await sset(ENT+"!H"+a+":I"+b,fresh.map(f=>f.hi))}
    await loadEntrenos();E.draft=null;E.removed=[];entPersist();toast(d.length+" ejercicios guardados");
  }catch(e){toast(errText(e))}
  E.saving=false;render();
}
function bindEntrenos(){
  const E=S.ent;
  document.querySelectorAll("[data-emode]").forEach(b=>b.onclick=()=>{syncEnt();E.mode=b.dataset.emode;
    if(E.mode==="vivo"&&!E.draft){const s=entFromSaved();if(s.length)E.draft=s}render()});
  const ef=document.getElementById("efecha");if(ef)ef.onchange=()=>{if(ef.value){E.date=ef.value;render()}};
  document.querySelectorAll("[data-eses]").forEach(b=>b.onclick=()=>{E.ses=+b.dataset.eses;if(E.mode==="vivo"&&!E.draft){const s=entFromSaved();if(s.length)E.draft=s}render()});
  const fl=document.getElementById("efile");if(fl)fl.onchange=async()=>{const f=fl.files&&fl.files[0];if(!f)return;
    try{entImg=await shrink(f);E.fname=f.name;document.getElementById("ename").textContent=f.name}catch(e){entImg=null;toast("No se pudo abrir esa imagen")}};
  const rd=document.getElementById("eRead");if(rd)rd.onclick=readEntreno;
  const mn=document.getElementById("eManual");if(mn)mn.onclick=()=>{syncEnt();E.draft=(E.draft||[]).concat([entBlank()]);render()};
  const ad=document.getElementById("eAdd");if(ad)ad.onclick=()=>{syncEnt();E.draft.push(entBlank());render()};
  const al=document.getElementById("eAddLive");if(al)al.onclick=()=>{E.draft=[entBlank()];render()};
  document.querySelectorAll("[data-edel]").forEach(b=>b.onclick=()=>{syncEnt();const [x]=E.draft.splice(+b.dataset.edel,1);if(x&&x.row)(E.removed=E.removed||[]).push(x.row);if(!E.draft.length&&!(E.removed||[]).length)E.draft=null;render()});
  document.querySelectorAll("[data-emv]").forEach(b=>b.onclick=()=>{syncEnt();const [i,dir]=b.dataset.emv.split("|").map(Number),j=i+dir;const d=E.draft;if(!d||j<0||j>=d.length)return;[d[i],d[j]]=[d[j],d[i]];entPersist();render()});
  const sv=document.getElementById("eSave");if(sv)sv.onclick=saveEntreno;
  const dr=document.getElementById("eDrop");if(dr)dr.onclick=()=>{E.draft=null;E.removed=[];render()};
  const ed=document.getElementById("eEdit");if(ed)ed.onclick=()=>{E.draft=entFromSaved();render()};
  document.querySelectorAll("[data-tgo]").forEach(b=>b.onclick=()=>{syncEnt();const i=+b.dataset.tgo,x=E.draft[i];
    if(x.tStart){stopTimer(x);toast((x.ejercicio||"Ejercicio")+": "+x.minutos+" min")}
    else{E.draft.forEach((y,j)=>{if(j!==i)stopTimer(y)});x.tStart=Date.now()}
    render()});
  document.querySelectorAll("[data-trs]").forEach(b=>b.onclick=()=>{syncEnt();const x=E.draft[+b.dataset.trs];x.tAcc=0;x.tStart=null;x.minutos="";render()});
  document.querySelectorAll("[data-er]").forEach(el=>el.addEventListener("change",()=>{syncEnt();entPersist()}));
  document.querySelectorAll('[data-er][data-k="ejercicio"]').forEach(inp=>inp.oninput=()=>{const p=document.querySelector('[data-opo="'+inp.dataset.er+'"]');if(p){const o=isOpo(inp.value);p.className="pill "+(o?"bad":"ok");p.textContent=o?"Oposición":"Sin oposición"}});
}

/* ---------- Wellness: respuestas del formulario de los jugadores (pestaña WELLNESS, solo lectura).
   A marca temporal, B jugador, C RPE de partido, D fatiga antes del partido, E fatiga hoy, F estrés, G comentarios, H motivación. */
async function loadWellness(){
  const v=await sget("WELLNESS!A1:H3000");
  S.well.rows=v.slice(1).map(r=>{const ts=String(r[0]||"").trim();return {iso:dmyToIso(ts.slice(0,10)),hora:ts.slice(11,16),name:String(r[1]||"").trim(),
    rpe:num(r[2]),fatAntes:num(r[3]),fatHoy:num(r[4]),estres:num(r[5]),com:String(r[6]||"").trim(),motiv:num(r[7])}}).filter(r=>r.iso&&r.name);
  S.well.loaded=true;
}
const wellKey=n=>String(n||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s+/)[0];
/* Jugador del U22 si su nombre empieza como uno de los de la app (Babacar → Baba, Alexis Pou → Alexis). */
function wellU22(name){const k=wellKey(name);return S.players.some(p=>{const q=wellKey(p);return q&&(k===q||k.startsWith(q))})}
/* A vigilar: un comentario, fatiga de hoy de 8 o más, o motivación de 2 o menos. */
function wellAlert(r){return !!r.com||(r.fatHoy!=null&&r.fatHoy>=8)||(r.motiv!=null&&r.motiv<=2)}
function viewWellness(){
  const W=S.well;
  if(!W.loaded)return `<div class="empty">Leyendo la pestaña WELLNESS…</div>`;
  if(!W.rows.length)return `<div class="empty">La pestaña WELLNESS todavía no tiene respuestas.</div>`;
  const weeks=[...new Set(W.rows.map(r=>mondayOf(r.iso)))].sort();
  if(!W.week||!weeks.includes(W.week))W.week=weeks[weeks.length-1];
  const wi=weeks.indexOf(W.week);
  const inWeek=W.rows.filter(r=>mondayOf(r.iso)===W.week&&(W.all||wellU22(r.name)));
  /* Si un jugador contesta dos veces la misma semana, vale la última. */
  const last={};inWeek.forEach(r=>{last[r.name]=r});
  const list=Object.values(last).sort((a,b)=>(wellAlert(b)-wellAlert(a))||a.name.localeCompare(b.name,"es"));
  const prevOf=r=>W.rows.filter(x=>x.name===r.name&&mondayOf(x.iso)<W.week).pop();
  const avg=k=>{const xs=list.map(r=>r[k]).filter(x=>x!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null};
  const faltan=W.all?[]:S.players.filter(p=>!list.some(r=>wellU22(r.name)&&wellKey(r.name).startsWith(wellKey(p))));
  const nav=`<div class="panel"><div class="row" style="justify-content:space-between">
      <button type="button" class="btn ghost" id="wlPrev"${wi<=0?" disabled":""}>‹</button>
      <div style="text-align:center"><span class="label">Semana del</span><div style="font:600 20px/1.2 var(--display)">${esc(isoToDMY(W.week).slice(0,5))} al ${esc(isoToDMY(addDays(W.week,6)).slice(0,5))}</div></div>
      <button type="button" class="btn ghost" id="wlNext"${wi>=weeks.length-1?" disabled":""}>›</button></div>
    <div class="chips"><button type="button" data-wall="0" aria-pressed="${!W.all}">U22</button><button type="button" data-wall="1" aria-pressed="${W.all}">Todos</button></div></div>`;
  const kpis=`<div class="kpis"><div class="kpi"><span class="label">Respuestas</span><b>${list.length}${W.all?"":"/"+S.players.length}</b><span class="note">${list.filter(wellAlert).length} a vigilar</span></div>
    <div class="kpi"><span class="label">Fatiga hoy</span><b>${fmt(avg("fatHoy"),1)}</b><span class="note">media</span></div>
    <div class="kpi"><span class="label">Motivación</span><b>${fmt(avg("motiv"),1)}</b><span class="note">media</span></div></div>`;
  const num1=(lab,v,cls)=>`<div class="wnum ${cls||""}"><span>${lab}</span><b>${v==null?"–":fmt(v,0)}</b></div>`;
  const cards=list.map(r=>{const pv=prevOf(r);const d=pv&&pv.fatHoy!=null&&r.fatHoy!=null?r.fatHoy-pv.fatHoy:null;
    return `<div class="wcard${wellAlert(r)?" alert":""}"><div class="whead"><b>${esc(r.name)}</b><span class="note">${esc(isoToDMY(r.iso).slice(0,5))} ${esc(r.hora)}</span></div>
    <div class="wnums">${num1("RPE partido",r.rpe)}${num1("Fatiga antes",r.fatAntes)}${num1("Fatiga hoy",r.fatHoy,r.fatHoy>=8?"bad":"")}${num1("Estrés",r.estres)}${num1("Motivación",r.motiv,r.motiv!=null&&r.motiv<=2?"warn":"")}</div>
    ${d!=null&&d!==0?`<span class="note">Fatiga hoy ${d>0?"+":""}${d} respecto a su respuesta anterior (${esc(isoToDMY(pv.iso).slice(0,5))})</span>`:""}
    ${r.com?`<p class="wcom">${esc(r.com)}</p>`:""}</div>`}).join("");
  return nav+kpis+`<div class="panel"><span class="label">Respuestas de la semana</span>
    ${list.length?`<div class="list">${cards}</div>`:`<div class="empty">Nadie ha contestado esta semana${W.all?"":" del U22"}.</div>`}
    ${faltan.length?`<div class="note">Sin contestar: ${faltan.map(esc).join(", ")}</div>`:""}</div>
    <div class="note">Se marca en rojo a quien deja un comentario, tiene fatiga de hoy de 8 o más o motivación de 2 o menos. Los datos salen de la pestaña WELLNESS (el formulario de los jugadores); aquí solo se leen.</div>`;
}
function bindWellness(){
  const W=S.well;const ws=()=>[...new Set(W.rows.map(r=>mondayOf(r.iso)))].sort();
  const pv=document.getElementById("wlPrev");if(pv)pv.onclick=()=>{const w=ws(),i=w.indexOf(W.week);if(i>0){W.week=w[i-1];render()}};
  const nx=document.getElementById("wlNext");if(nx)nx.onclick=()=>{const w=ws(),i=w.indexOf(W.week);if(i<w.length-1){W.week=w[i+1];render()}};
  document.querySelectorAll("[data-wall]").forEach(b=>b.onclick=()=>{W.all=b.dataset.wall==="1";render()});
}

function viewEquipo(){
  const up=!!S.assets&&!!S.db;
  const rows=S.players.map(n=>`<div class="ph-row"><div class="av">${avatar(n)}</div><div class="nm" style="font:600 20px/1.1 var(--display)">${esc(n)}</div>
    ${up?`<label class="btn" for="f-${slug(n)}">${S.photos[slug(n)]?"Cambiar foto":"Poner foto"}</label><input id="f-${slug(n)}" type="file" accept="image/*" data-up="${esc(n)}">`:""}</div>`).join("");
  return `<div class="panel"><span class="label">Fotos para la pantalla de RPE</span>
    <div class="note">${up?"Haz la foto o elígela de la galería. Se recorta en cuadrado automáticamente.":"Escribe la clave de la app para poder subir fotos."}</div>
    <div class="list">${rows}</div></div>
    <div class="note">Los jugadores salen de la pestaña RPE de la hoja. Si apuntas a alguien nuevo allí, aparece aquí al pulsar Actualizar.</div>`;
}

const photoUrl=id=>String(id).startsWith("data:")?id:"/_blob/"+id;
async function uploadPhoto(name,file){
  try{
    const img=await createImageBitmap(file);const s=Math.min(img.width,img.height);const c=document.createElement("canvas");c.width=c.height=480;
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,480,480);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    const res=await S.assets.upload(blob,{type:"image/jpeg"});
    await S.db.collection("players").doc(slug(name)).set({name,photo:res.id});
    S.photos[slug(name)]=photoUrl(res.id);toast("Foto de "+name+" guardada");render();
  }catch(e){toast("No se pudo subir la foto ("+(e&&e.code||"error")+").")}
}

function bind(){
  bindCharts();bindEntrenos();bindWellness();
  document.querySelectorAll("[data-player]").forEach(b=>b.onclick=()=>S.kiosk?openKioskScale(b.dataset.player):openScale(b.dataset.player));
  const ko=document.getElementById("kioskOn");if(ko)ko.onclick=()=>{S.kiosk=true;render();window.scrollTo(0,0)};
  document.querySelectorAll("[data-prac],[data-pick]").forEach(b=>b.onclick=()=>{S.practice=+(b.dataset.prac||b.dataset.pick);S.practiceSet=true;render()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const [d,p]=b.dataset.go.split("|");S.date=d;S.practice=+p;S.practiceSet=true;S.tab="sesion";render();window.scrollTo(0,0)});
  const wp=document.getElementById("wprev");if(wp)wp.onclick=()=>{S.week=addDays(S.week,-7);render()};
  const wn=document.getElementById("wnext");if(wn)wn.onclick=()=>{S.week=addDays(S.week,7);render()};
  const hf=document.getElementById("hfile");if(hf)hf.onchange=async()=>{const fl=hf.files&&hf.files[0];if(!fl)return;
    try{pendingImg=await shrink(fl);S.hname=fl.name;document.getElementById("hname").textContent=fl.name}catch(e){pendingImg=null;toast("No se pudo abrir esa imagen")}};
  const rh=document.getElementById("readH");if(rh)rh.onclick=readHorario;
  const mn=document.getElementById("manual");if(mn)mn.onclick=()=>{S.draft=(S.draft||[]).concat([{fecha:S.week,sesion:1,hora:"",tipo:"",minutos:null,notas:""}]);render()};
  const ar=document.getElementById("addRow");if(ar)ar.onclick=()=>{syncDraft();const last=S.draft[S.draft.length-1];S.draft.push({fecha:last?last.fecha:S.week,sesion:1,hora:"",tipo:"",minutos:null,notas:""});render()};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{syncDraft();S.draft.splice(+b.dataset.del,1);if(!S.draft.length)S.draft=null;render()});
  const sd=document.getElementById("saveDraft");if(sd)sd.onclick=saveDraft;
  const dd=document.getElementById("dropDraft");if(dd)dd.onclick=()=>{S.draft=null;render()};
  const f=document.getElementById("fecha");if(f)f.onchange=()=>{if(f.value){S.date=f.value;S.practiceSet=false;pickPractice();S.loads={};render();if(S.mcp)loadLoad(S.loadTab).then(render).catch(()=>{})}};
  const sm=document.getElementById("saveMin");if(sm)sm.onclick=()=>{const v=document.getElementById("minutos").value.trim();const n=v===""?null:num(v);
    if(v!==""&&(n==null||n<0||n>300)){toast("Escribe los minutos entre 0 y 300");return}saveTiempo(n)};
  document.querySelectorAll("[data-load]").forEach(b=>b.onclick=async()=>{S.loadTab=b.dataset.load;render();if(!S.loads[S.loadTab]&&S.mcp){try{await loadLoad(S.loadTab)}catch(e){S.err=errText(e)}render()}});
  const pd=document.getElementById("pdate");if(pd)pd.onchange=()=>{if(pd.value){S.pesoDate=pd.value;render()}};
  const sp=document.getElementById("savePeso");if(sp)sp.onclick=savePesos;
  document.querySelectorAll("[data-up]").forEach(i=>i.onchange=()=>{if(i.files&&i.files[0])uploadPhoto(i.dataset.up,i.files[0])});
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=async()=>{S.tab=b.dataset.tab;render();
  if(S.tab==="carga"&&!S.loads[S.loadTab]&&S.mcp){try{await loadLoad(S.loadTab)}catch(e){S.err=errText(e)}render()}
  if(S.tab==="pesos"&&!S.pesos&&S.mcp){try{await loadPesos()}catch(e){S.err=errText(e)}render()}
  if(S.tab==="entrenos"&&!S.ent.loaded&&S.mcp){try{await loadEntrenos()}catch(e){S.err=errText(e)}render()}
  if(S.tab==="wellness"&&!S.well.loaded&&S.mcp){try{await loadWellness()}catch(e){S.err=errText(e)}render()}});
(()=>{const h=document.getElementById("title");let t=null;const stop=()=>{clearTimeout(t);t=null};
  h.addEventListener("pointerdown",()=>{if(!S.kiosk)return;stop();t=setTimeout(()=>{S.kiosk=false;document.getElementById("sheetHost").innerHTML="";render();toast("Modo entrenador")},2000)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,stop));
  h.addEventListener("contextmenu",e=>{if(S.kiosk)e.preventDefault()})})();
function exitKiosk(){S.kiosk=false;document.getElementById("sheetHost").innerHTML="";render();toast("Modo entrenador")}
/* Botón visible para salir del modo jugador: un toque basta (Iñigo lo pidió así el 21/10). */
document.addEventListener("click",e=>{if(S.kiosk&&e.target.closest&&e.target.closest("#kioskOff"))exitKiosk()});
document.getElementById("reload").onclick=()=>{if(S.mcp)loadAll();else toast("Escribe la clave de la app para conectar con la hoja.")};

entRestore();
render();
(async()=>{
  const C=window.claude;
  if(!C||!C.use){S.err="No se ha podido arrancar la conexión con la hoja U22.";setSync("Sin conexión");render();return}
  C.use("db").then(db=>{S.db=db;if(!db)return;db.collection("players").onSnapshot(snap=>{snap.docs.forEach(d=>{const x=d.data()||{};if(x.photo)S.photos[d.id]=photoUrl(x.photo)});render()},()=>{})});
  C.use("assets").then(a=>{S.assets=a;if(S.tab==="equipo")render()});
  C.use("sample").then(async s=>{S.sample=s;if(s){const l=await s.limits().catch(()=>null);S.imgOK=!!(l&&l.images)}if(S.tab==="horario")render()});
  S.mcp=await C.use("mcp");
  if(!S.mcp){S.err="Escribe la clave de la app para conectar con la hoja U22.";setSync("Sin conexión");render();return}
  loadAll();
})();
</script>
